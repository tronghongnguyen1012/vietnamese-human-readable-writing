<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ViWrite Logo">
  <defs>
    <linearGradient id="vw-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="vw-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>
  <!-- 10% safe padding: all geometry kept within 12..116 -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#vw-teal)"/>
  <!-- Inner white clarity card -->
  <rect x="26" y="26" width="76" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.96"/>
  <!-- Structured Vietnamese clarity lines (BLUF -> detail -> verify) -->
  <rect x="36" y="40" width="38" height="7" rx="3.5" fill="#0F766E"/>
  <rect x="36" y="54" width="56" height="6" rx="3" fill="#334155" fill-opacity="0.82"/>
  <rect x="36" y="66" width="44" height="6" rx="3" fill="#334155" fill-opacity="0.58"/>
  <!-- Accent pen nib / clarity diamond -->
  <path d="M84 34 L94 44 L76 62 L66 52 Z" fill="url(#vw-coral)"/>
  <circle cx="88" cy="83" r="6" fill="#0F766E"/>
  <path d="M36 83 H74" stroke="#14B8A6" stroke-width="5" stroke-linecap="round"/>
</svg>
